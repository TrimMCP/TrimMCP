name: Feature Request
description: Suggest a new feature or enhancement for SlimMCP
title: "[Feature]: "
labels: ["enhancement", "triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please provide as much detail as possible to help us understand your request.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Describe the problem this feature would solve. What are you trying to accomplish?
      placeholder: I'm always frustrated when... / I need to... / It would be helpful if...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see
      placeholder: I would like SlimMCP to...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered any alternative solutions or workarounds?
      placeholder: I've tried... / An alternative could be...
    validations:
      required: false

  - type: dropdown
    id: category
    attributes:
      label: Feature Category
      description: Which aspect of SlimMCP does this feature relate to?
      options:
        - Filtering/Optimization
        - Configuration
        - Monitoring/Metrics
        - Performance
        - Security
        - API/Protocol
        - Documentation
        - Developer Experience
        - Other
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this feature to you?
      options:
        - Nice to have
        - Would be helpful
        - Important for my use case
        - Critical blocker
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Use Case / Examples
      description: Provide specific examples or use cases where this feature would be valuable
      placeholder: |
        Example 1: When processing Notion pages...
        Example 2: In my deployment scenario...
    validations:
      required: true

  - type: textarea
    id: benefits
    attributes:
      label: Benefits
      description: Who would benefit from this feature? How would it improve SlimMCP?
      placeholder: This would help users who... / This would improve performance by... / This would make it easier to...
    validations:
      required: true

  - type: textarea
    id: implementation
    attributes:
      label: Implementation Ideas (Optional)
      description: If you have thoughts on how this could be implemented, share them here
      placeholder: This could be implemented by... / The config could look like...
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context, mockups, screenshots, or references
      placeholder: Similar feature in X... / Reference: https://...
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I have searched existing feature requests to avoid duplicates
          required: true
        - label: This feature aligns with SlimMCP's core purpose (MCP proxy with token optimization)
          required: true
        - label: I have considered the impact on existing users and backward compatibility
          required: false
        - label: I would be willing to contribute a PR for this feature
          required: false
