name: Deploy Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

jobs:
  validate:
    name: Validate Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for broken links
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          folder-path: 'docs/'
          config-file: '.github/markdown-link-check-config.json'
        continue-on-error: true

      - name: Lint markdown files
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: 'docs/**/*.md'
        continue-on-error: true

      - name: Check documentation structure
        run: |
          echo "Checking required documentation files..."

          REQUIRED_FILES=(
            "docs/README.md"
            "docs/getting-started.md"
            "docs/configuration.md"
            "docs/architecture.md"
            "docs/api.md"
          )

          MISSING=()
          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              MISSING+=("$file")
            fi
          done

          if [ ${#MISSING[@]} -ne 0 ]; then
            echo "❌ Missing required documentation files:"
            printf '%s\n' "${MISSING[@]}"
            exit 1
          fi

          echo "✅ All required documentation files present"

  deploy:
    name: Deploy to slimmcp/docs
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "SlimMCP Bot"
          git config user.email "bot@slimmcp.com"

      - name: Deploy documentation
        env:
          DEPLOY_TOKEN: ${{ secrets.SLIMMCP_DEPLOY_TOKEN }}
        run: |
          # Clone docs repo
          git clone https://x-access-token:${DEPLOY_TOKEN}@github.com/slimmcp/docs.git docs-repo

          # Sync documentation (exclude internal/draft docs)
          rsync -av --delete \
            --exclude='.git/' \
            --exclude='commercial-hosted.md' \
            --exclude='recording-real-responses.md' \
            --exclude='poc/' \
            --exclude='*.draft.md' \
            docs/ docs-repo/

          # Commit and push
          cd docs-repo
          git add .

          if git diff --staged --quiet; then
            echo "No documentation changes to commit"
          else
            COMMIT_MSG="Update documentation from monorepo

          Source commit: ${{ github.sha }}
          Triggered by: ${{ github.event_name }}
          Actor: ${{ github.actor }}"

            git commit -m "$COMMIT_MSG"
            git push origin main

            echo "✅ Documentation deployed successfully"
          fi

      - name: Create deployment summary
        run: |
          echo "## Documentation Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Deployed to: slimmcp/docs" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: main" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Website: https://docs.slimmcp.com" >> $GITHUB_STEP_SUMMARY

  notify:
    name: Notify on Failure
    needs: [validate, deploy]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Create failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = '📚 Documentation Deployment Failed';
            const body = `Documentation deployment failed for commit ${context.sha}.

            **Workflow:** ${context.workflow}
            **Run:** ${context.runId}
            **Actor:** ${context.actor}

            Please check the [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for details.`;

            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['documentation', 'ci/cd', 'bug']
            });
